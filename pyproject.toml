[project]
name = "tikitaka"
version = "0.1.0"
description = "Builder/Reviewer-Orchestrator für Coding-Agents (Claude Code, OpenCode, Kiro, ...) mit OpenSpec und Human Gates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.10",
    "pyyaml>=6.0",
]

[project.scripts]
tikitaka = "tikitaka.cli:main"
agent-tandem = "tikitaka.cli:main"  # alter Name: bestehende Coach-Einbindungen laufen weiter

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tikitaka"]

[tool.pytest.ini_options]
testpaths = ["tests"]
