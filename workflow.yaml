# tikitaka – Workflow-Konfiguration
#
# Rollen -> Harness. Kombinationen frei tauschbar, z.B.
#   claude + opencode, opencode + opencode, kiro + opencode ...

agents:
  # Builder (Spec + Code): Claude Haiku 5.5 (GitHub Copilot) · Reviewer: DeepSeek auf Hagrid -> unterschiedliche Modelle
  spec_builder:  { harness: opencode, model: "github-copilot/claude-haiku-5.5", prompt: prompts/spec-builder.md }
  spec_reviewer: { harness: opencode, model: "hagrid/DeepSeek-V4.1-Flash-1017", prompt: prompts/spec-reviewer.md, readonly: true }
  code_builder:  { harness: opencode, model: "github-copilot/claude-haiku-5.5", prompt: prompts/code-builder.md }
  code_reviewer: { harness: opencode, model: "hagrid/DeepSeek-V4.1-Flash-1017", prompt: prompts/code-reviewer.md, readonly: true }
  # Optional pro Agent: model: "provider/model" (opencode: `opencode models` listet die verfügbaren).
  # Tipp: Builder und Reviewer mit unterschiedlichen Modellen -> unterschiedliche blinde Flecken.

# Agenten-Runden Builder -> Reviewer pro Durchlauf
max_agent_rounds: 2
# Runden nach Human-Feedback (nur zum Absichern)
rounds_after_human: 1
# Wie oft der Builder rote Checks reparieren darf (zählt nicht als Review-Runde)
max_check_fixes: 2
# Welche Severities eine neue Runde auslösen
blocking_severities: [blocker, major]
timeout_seconds: 1800

human_gates:
  after_spec: true    # Freigabe der Spec vor dem Code
  after_code: true    # Freigabe des Codes vor Archiv/Merge
  on_conflict: true   # Builder/Reviewer nach max. Runden uneinig -> an dich

# Deterministische Checks vor jedem LLM-Review. {change} wird ersetzt.
# Laufen im Projektverzeichnis.
checks:
  spec:
    - openspec validate {change} --strict
  code:
    - uv run pytest -q

# Nach finaler Freigabe `openspec archive` ausführen
archive_on_done: true
# Agenten melden Ergebnisse über den tikitaka-MCP-Server (Fallback: JSON-Block im Text)
mcp: true
# macOS-Benachrichtigung an Human Gates
notify: true

# Harness-Aufrufe. Platzhalter: {prompt}, {prompt_file}, {model}
# write_args  -> Builder (darf Dateien ändern)
# readonly_args -> Reviewer (nur lesen)
# session_args / resume_args -> Reviewer-Sitzung mit eigener ID starten / fortsetzen (Rückfragen mit vollem Kontext).
#   Platzhalter: {session_uuid} (UUID), {session_hex} (UUID ohne Bindestriche). Ohne sie: Rückfrage mit dem Ende der Antwort.
# mcp_args / mcp_env -> tikitaka-MCP-Server anbinden (submit_review/submit_build, ask_human).
#   Platzhalter: {mcp_claude_config} (Datei im mcpServers-Format), {mcp_opencode_config} (JSON-Inhalt, OpenCode V1: mcp.<name>),
#   {mcp_opencode_v2_config} (JSON-Inhalt, OpenCode V2: mcp.servers.<name>)
# mcp_config_file / mcp_config_content -> stattdessen eine Projektdatei mit dem MCP-Server anlegen (für Harnesses,
#   deren Hintergrunddienst die Umgebung des Clients ignoriert). {mcp_opencode_v2_static_config}: Schritt und Rolle
#   liest der Server dann bei jedem Aufruf aus mcp/current.json.
# models_cmd -> listet die Modell-IDs des Harness (eine pro Zeile); `run`/`resume` und `doctor` prüfen damit die Konfiguration.
# blocked_patterns -> Regexe für Ausgaben, die eine verweigerte Berechtigung melden. Der Lauf warnt; ab 3 Treffern in
#   einem Aufruf wird der Agent beendet, weil er ohne Zugriff nur rät.
# transient_patterns -> Regexe für Fehler, die oft beim zweiten Versuch verschwinden (Token, Rate-Limit, Anbieter): ein
#   automatischer Wiederholungsversuch nach 5s, bevor der Lauf als Agent-Fehler stoppt.
harnesses:
  claude:
    cmd: [claude, -p, "{prompt}"]
    session_args: [--session-id, "{session_uuid}"]
    resume_args: [--resume, "{session_uuid}"]
    model_args: [--model, "{model}"]
    write_args:
      - --permission-mode
      - acceptEdits
      - --allowedTools
      - "Bash(uv:*)"
      - "Bash(python:*)"
      - "Bash(openspec:*)"
      - "Bash(git status:*)"
      - "Bash(git diff:*)"
      - "Bash(ls:*)"
      - "Bash(mkdir:*)"
    readonly_args:
      - --allowedTools
      - Read
      - Grep
      - Glob
      - "Bash(git diff:*)"
      - "Bash(git log:*)"
      - "Bash(openspec validate:*)"
      - "Bash(openspec show:*)"
      - "Bash(uv run pytest:*)"
      - --disallowedTools
      - Edit
      - Write
      - NotebookEdit
    mcp_args: [--mcp-config, "{mcp_claude_config}", --allowedTools, "mcp__tikitaka"]

  # OpenCode V2: Der Hintergrunddienst ignoriert die Umgebung (OPENCODE_CONFIG_CONTENT) des Clients, und
  # `--standalone` (privater Server) kennt weder die Kiro- noch die GitHub-Copilot-Anmeldung. Deshalb liest OpenCode
  # den MCP-Server aus einer Projektdatei, die tikitaka anlegt, lokal ignoriert und am Laufende wieder entfernt.
  # --auto gibt nicht-interaktiv frei, was nicht ausdrücklich per deny gesperrt ist (ask würde abgelehnt).
  opencode:
    cmd: [opencode, run, "{prompt}"]
    session_args: [--session, "ses_{session_hex}"]
    resume_args: [--session, "ses_{session_hex}"]
    model_args: [-m, "{model}"]
    write_args: [--agent, build, --auto]
    readonly_args: [--agent, plan, --auto]
    mcp_config_file: .opencode/opencode.json
    mcp_config_content: "{mcp_opencode_v2_static_config}"
    models_cmd: [opencode, models]
    transient_patterns:
      - "HTTP (401|429|5\\d\\d)"
      - "Model unavailable"
      - "Internal error"
    blocked_patterns:
      - "permission requested: .*auto-rejecting"

  # Kiro CLI – Flags vor Nutzung mit `kiro-cli chat --help` prüfen
  kiro:
    cmd: [kiro-cli, chat, --no-interactive, "{prompt}"]
    model_args: [--model, "{model}"]
    write_args: [--trust-all-tools]
    readonly_args: [--trust-tools, "fs_read"]
